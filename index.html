<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiPower: Neural Bridge</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        :root {
            --hex-dark: #0f172a;
            --hex-cyan: #22d3ee;
            --hex-blue-light: #7dd3fc;
            --hex-soft-gray: #94a3b8;
            --hex-success: #10b981;
            --hex-error: #f43f5e;
            --glass: rgba(30, 41, 59, 0.7);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--hex-dark);
            background-image: radial-gradient(circle at top right, #1e3a8a, transparent),
                              radial-gradient(circle at bottom left, #0891b2, transparent);
            color: #f1f5f9;
            margin: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }

        #app-shell {
            background: var(--glass);
            backdrop-filter: blur(12px);
            width: 95%; max-width: 600px;
            padding: 40px; border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center; position: relative;
        }

        .version-tag {
            position: absolute; top: 15px; right: 20px;
            font-family: monospace; font-size: 0.7rem; color: var(--hex-cyan);
            opacity: 0.8; letter-spacing: 1px;
        }

        h1 { color: var(--hex-cyan); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
        
        .status-bar { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--hex-soft-gray); margin-bottom: 25px; font-family: monospace; }

        .exercise-card {
            background: rgba(15, 23, 42, 0.5);
            padding: 30px; border-radius: 16px; margin: 20px 0;
            border: 1px solid rgba(125, 211, 252, 0.1);
            font-size: 1.8rem;
        }

        .options-grid { display: grid; gap: 12px; margin-top: 25px; }
        
        .btn-opt {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; padding: 18px; border-radius: 12px;
            cursor: pointer; transition: 0.3s; font-size: 1.1rem;
        }

        .btn-opt:hover { background: rgba(34, 211, 238, 0.1); border-color: var(--hex-cyan); transform: scale(1.02); }
        .btn-opt.correct { background: var(--hex-success) !important; border-color: #059669; }
        .btn-opt.wrong { background: var(--hex-error) !important; border-color: #e11d48; }

        .feedback-panel {
            margin-top: 20px; padding: 20px; border-radius: 12px;
            display: none; text-align: left;
            background: rgba(15, 23, 42, 0.9);
            border-left: 4px solid var(--hex-cyan);
            animation: fadeIn 0.4s ease;
        }

        .step-by-step { margin-top: 15px; color: #e2e8f0; line-height: 1.7; font-size: 1rem; }

        .btn-next {
            background: var(--hex-cyan); color: var(--hex-dark);
            border: none; padding: 15px; border-radius: 8px;
            font-weight: 800; cursor: pointer; width: 100%;
            margin-top: 15px; text-transform: uppercase;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="app-shell">
    <div class="version-tag">VER. 2.2.0-STABLE</div>

    <div id="scr-start">
        <h1>LogiPower</h1>
        <p style="color: var(--hex-soft-gray);">Neural Bridge - Diego</p>
        <div style="margin: 30px 0; font-size: 0.9rem; color: var(--hex-blue-light);">
            Listo para convertir logaritmos y potencias.
        </div>
        <button class="btn-next" onclick="initApp()">Iniciar Sincronización</button>
    </div>

    <div id="scr-game" class="hidden">
        <div class="status-bar">
            <span>NODE_ID: <span id="node-idx">01</span>/20</span>
            <span>INTEGRITY: <span id="node-score">0</span>%</span>
        </div>
        <p id="instr" style="color: var(--hex-blue-light); font-weight: bold;"></p>
        <div id="math-display" class="exercise-card"></div>
        
        <div id="options" class="options-grid"></div>

        <div id="feedback" class="feedback-panel">
            <div id="feed-msg" style="font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;"></div>
            <div id="step-by-step" class="step-by-step"></div>
            <button class="btn-next" onclick="nextQuestion()">Siguiente Reto →</button>
        </div>
    </div>

    <div id="scr-results" class="hidden">
        <h1>Análisis de Sesión</h1>
        <div id="final-stats" style="font-size: 1.4rem; margin: 30px 0;"></div>
        <button class="btn-next" onclick="initApp()">Reiniciar Protocolo</button>
        <button class="btn-next" style="background: transparent; border: 1px solid var(--hex-soft-gray); color: white;" onclick="location.reload()">Finalizar</button>
    </div>
</div>

<script>
    let state = { idx: 0, score: 0, total: 20, questions: [], answered: false };

    function generateQuestions() {
        let qArr = [];
        const bases = [2, 3, 5, 10];
        for (let i = 0; i < 20; i++) {
            let isLog = Math.random() > 0.5;
            let b = bases[Math.floor(Math.random() * bases.length)];
            let exp = Math.floor(Math.random() * 3) + 1;
            let res = Math.pow(b, exp);
            
            let resTex = res.toString();
            let expVal = exp;

            if (Math.random() > 0.6) { // Casos con fracciones/decimales
                if (b === 10) {
                    resTex = exp === 1 ? "0,1" : (exp === 2 ? "0,01" : "0,001");
                } else {
                    resTex = `\\frac{1}{${res}}`;
                }
                expVal = -exp;
            }

            if (isLog) {
                qArr.push({
                    q: `\\log_{${b}}(${resTex}) = ${expVal}`,
                    instr: "Convierte a POTENCIA:",
                    ans: `${b}^{${expVal}} = ${resTex}`,
                    alts: [`${b}^{${expVal}} = ${resTex}`, `${expVal}^{${b}} = ${resTex}`, `${resTex}^{${expVal}} = ${b}`],
                    step: `Recuerda la definición: El logaritmo $\\log_b(a)=c$ es el exponente al que hay que elevar la base $b$ para obtener $a$.<br><br>1. Base: $${b}$<br>2. Exponente: $${expVal}$<br>3. Resultado: $${resTex}$`
                });
            } else {
                qArr.push({
                    q: `${b}^{${expVal}} = ${resTex}`,
                    instr: "Convierte a LOGARITMO:",
                    ans: `\\log_{${b}}(${resTex}) = ${expVal}`,
                    alts: [`\\log_{${b}}(${resTex}) = ${expVal}`, `\\log_{${resTex}}(${b}) = ${expVal}`, `\\log_{${expVal}}(${resTex}) = ${b}`],
                    step: `Para pasar de potencia $b^c = a$ a logaritmo:<br><br>1. La base de la potencia ($${b}$) se mantiene como base del logaritmo.<br>2. El exponente ($${expVal}$) es el resultado del logaritmo.<br>3. El valor ($${resTex}$) es el argumento del logaritmo.`
                });
            }
        }
        return qArr;
    }

    function initApp() {
        state.idx = 0; state.score = 0;
        state.questions = generateQuestions();
        document.getElementById('scr-start').classList.add('hidden');
        document.getElementById('scr-results').classList.add('hidden');
        document.getElementById('scr-game').classList.remove('hidden');
        renderQuestion();
    }

    function renderQuestion() {
        state.answered = false;
        const q = state.questions[state.idx];
        document.getElementById('node-idx').innerText = (state.idx + 1).toString().padStart(2, '0');
        document.getElementById('node-score').innerText = Math.round((state.score / (state.idx || 1)) * 100);
        document.getElementById('instr').innerText = q.instr;
        
        const display = document.getElementById('math-display');
        display.innerHTML = `$$ ${q.q} $$`;
        
        const optsArea = document.getElementById('options');
        optsArea.innerHTML = '';
        document.getElementById('feedback').style.display = 'none';

        let alts = [...q.alts].sort(() => Math.random() - 0.5);
        alts.forEach(a => {
            const btn = document.createElement('button');
            btn.className = 'btn-opt';
            btn.innerHTML = `$$ ${a} $$`;
            btn.onclick = () => check(a, q.ans, btn);
            optsArea.appendChild(btn);
        });

        triggerKaTeX(document.getElementById('scr-game'));
    }

    function check(selected, correct, btn) {
        if (state.answered) return;
        state.answered = true;
        const q = state.questions[state.idx];
        const feed = document.getElementById('feedback');
        const msg = document.getElementById('feed-msg');
        const stepDiv = document.getElementById('step-by-step');

        feed.style.display = 'block';

        if (selected === correct) {
            state.score++;
            btn.classList.add('correct');
            msg.innerHTML = "✓ NODO SINCRONIZADO";
            msg.style.color = "var(--hex-success)";
            stepDiv.innerHTML = "¡Excelente! Has aplicado correctamente la propiedad.";
        } else {
            btn.classList.add('wrong');
            msg.innerHTML = "× INTERFERENCIA DETECTADA";
            msg.style.color = "var(--hex-error)";
            stepDiv.innerHTML = q.step;
            triggerKaTeX(stepDiv);
        }
    }

    function triggerKaTeX(element) {
        renderMathInElement(element, {
            delimiters: [
                {left: "$$", right: "$$", display: true},
                {left: "$", right: "$", display: false}
            ],
            throwOnError: false
        });
    }

    function nextQuestion() {
        state.idx++;
        if (state.idx < state.total) renderQuestion();
        else {
            document.getElementById('scr-game').classList.add('hidden');
            document.getElementById('scr-results').classList.remove('hidden');
            document.getElementById('final-stats').innerHTML = `Efectividad: ${state.score}/${state.total}<br>${Math.round((state.score/state.total)*100)}% de precisión.`;
        }
    }
</script>
</body>
</html>
